plugins {
    id 'java-library'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.gradle.userdev' version '7.1.38'
}

// Clean SemVer only — this is what ends up in ${file.jarVersion} inside neoforge.mods.toml.
// The MC tag is added to the *filename* only, in the jar task below.
version = mod_version
group = 'com.zenil.pam'

base {
    archivesName = mod_id
}

java {
    withSourcesJar()
    // MC 26.2 vanilla sources use unnamed variables (`_ ->`), standard only since Java 22 (JEP 456).
    // 25 is what's actually installed locally; drop to the real documented minimum once Mojang publishes one.
    toolchain.languageVersion = JavaLanguageVersion.of(25)
}

repositories {
    mavenCentral()
}

dependencies {
    implementation "net.neoforged:neoforge:${neo_version}"
}

runs {
    configureEach {
        systemProperty 'forge.logging.markers', 'REGISTRIES'
        systemProperty 'forge.logging.console.level', 'debug'
        modSource project.sourceSets.main
    }

    client {
        runType 'client'
        systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
    }

    server {
        runType 'server'
        systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        programArgument '--nogui'
    }
}

// Token-substitutes ${...} placeholders in neoforge.mods.toml from gradle.properties.
tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
        mod_id              : mod_id,
        mod_name            : mod_name,
        mod_version         : mod_version,
        mod_authors         : mod_authors,
        mod_description     : mod_description,
        mod_license         : mod_license,
        minecraft_version   : minecraft_version,
        neo_version_range   : neo_version_range,
        loader_version_range: loader_version_range
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties + [file: [jarVersion: mod_version]]
    }
}

// --- Jar naming requirement -------------------------------------------------
// Output filename: pam-mc26.2_1.0.0.jar
// In-jar metadata (neoforge.mods.toml version, manifest): clean 1.0.0
tasks.named('jar', Jar).configure {
    archiveFileName = "${mod_id}-${mc_tag}_${mod_version}.jar"
    manifest {
        attributes([
            'Specification-Title'   : mod_name,
            'Specification-Vendor'  : mod_authors,
            'Specification-Version' : mod_version,
            'Implementation-Title'  : mod_name,
            'Implementation-Version': mod_version,
            'Implementation-Vendor' : mod_authors
        ])
    }
}

tasks.named('sourcesJar', Jar).configure {
    archiveFileName = "${mod_id}-${mc_tag}_${mod_version}-sources.jar"
}
